# cargo-deny configuration for canter (strict; public repository).
# Consumed by: `just security`, CI supply-chain job (cargo-deny 0.20.2).
# There are zero external dependencies in this bootstrap; this file is the
# strict policy that any future dependency must satisfy.

[advisories]
# Deny yanked crates and published advisories at default severity. The ignore
# table is intentionally EMPTY: no advisory may be ignored without an
# issue-linked, expiry-bound reason (a future maintainer decision, not a
# bootstrap carve-out).
ignore = []
yanked = "deny"

[licenses]
# Public repository: allow only permissive, OSI-approved licenses. Any
# license outside this allowlist fails the check (deny-by-default).
#
# Ratatui operator surface (slice #90, Refs #90/#83): the mandatory
# ratatui/crossterm closure cannot satisfy the two-license core allowlist —
# unicode-ident (every proc-macro stack, incl. syn/proc-macro2 used by
# ratatui's strum/derive_more/darling chain) carries a Unicode-3.0 clause,
# and foldhash (the default hasher of the hashbrown 0.16 pinned by
# ratatui-core's layout engine kasuari) is Zlib. Both are permissive,
# OSI-approved licenses; they are required by the closure and cannot be
# version-pinned away without downgrading shared crates, so they are
# allowed explicitly here and nowhere wider.
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates still get their licenses checked even when unpublished.
ignore = false

[bans]
# A crate may appear only once (per semver-compatible version) in the tree.
#
# Ratatui operator surface (slice #90, Refs #90/#83): two semver-
# incompatible requirement splits are unavoidable inside the ratatui/
# crossterm closure — kasuari (ratatui-core's layout engine) pins
# hashbrown 0.16 while the rest of the graph (indexmap/ratatui-core)
# resolves 0.17, and the proc-macro stack splits syn 2 (strum_macros,
# derive_more-impl) from syn 3 (darling, thiserror-impl). No single version
# satisfies either pair. Skipped here at EXACT versions; any other
# duplicate anywhere in the tree still fails.
multiple-versions = "deny"
skip = [
    { name = "hashbrown", version = "=0.16.1" },
    { name = "syn", version = "=2.0.119" },
]
wildcards = "deny"
highlight = "all"

[sources]
# No unknown registries, no git/private sources. Dependencies must come from
# the crates.io index only.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
