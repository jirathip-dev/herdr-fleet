# Security and supply-chain gates for herdr-fleet (public repository).
# Job names are STABLE contract: they become required-check contexts later.

name: security

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: cargo-deny (licenses/bans/sources/advisories)
        run: cargo deny check

      - name: cargo-audit (RustSec advisory database)
        run: cargo audit

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          GL_VERSION="v8.30.1"
          ASSET="gitleaks_8.30.1_linux_x64.tar.gz"
          URL_BASE="https://github.com/gitleaks/gitleaks/releases/download/${GL_VERSION}"
          curl -fsSL -o /tmp/gitleaks.tar.gz "${URL_BASE}/${ASSET}"
          curl -fsSL -o /tmp/gitleaks.checksums "${URL_BASE}/gitleaks_8.30.1_checksums.txt"
          EXPECTED="$(awk -v a="${ASSET}" '$2 == a { print $1 }' /tmp/gitleaks.checksums)"
          if [ -z "$EXPECTED" ]; then
            echo "::error::could not find checksum for ${ASSET}"
            exit 1
          fi
          ACTUAL="$(sha256sum /tmp/gitleaks.tar.gz | awk '{ print $1 }')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::gitleaks checksum mismatch"
            exit 1
          fi
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          chmod +x "$HOME/.local/bin/gitleaks"
          "$HOME/.local/bin/gitleaks" version

      - name: Gitleaks scan of the full checked-out tree
        run: |
          "$HOME/.local/bin/gitleaks" dir --no-banner --redact --exit-code 1 .

      - name: Git-index public-tree scan (filenames + content parser)
        run: python3 scripts/check-public-tree.py .
