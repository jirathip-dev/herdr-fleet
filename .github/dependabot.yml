# Dependabot for canter.
# Grouped weekly updates; all PRs target `staging` (never `main`).

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    target-branch: staging
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: staging
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
